spring:
  application:
    name: swap-service

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bookswap_swap_db
    username: ${DB_USERNAME:wasiflatifhussain}
    password: ${DB_PASSWORD:password}
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
      services:
        swap-service:
          topic: swap.events

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/BookSwap}

server:
  port: 8085

keycloak:
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/BookSwap/protocol/openid-connect/token}
  service-service-comms-client:
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:service-service-comms}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}

outbox:
  relay:
    fixedDelayMs: 10000