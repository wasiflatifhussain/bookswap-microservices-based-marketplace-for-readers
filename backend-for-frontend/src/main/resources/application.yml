spring:
  application:
    name: backend-for-frontend
  output:
    ansi:
      enabled: ALWAYS
  client-endpoints:
    catalog: http://localhost:8081
    media: http://localhost:8082
    wallet: http://localhost:8084
    swap: http://localhost:8085
    notification: http://localhost:8086
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/BookSwap

http:
  timeoutMs: 2000
  maxInMemoryMb: 16

server:
  port: 8080