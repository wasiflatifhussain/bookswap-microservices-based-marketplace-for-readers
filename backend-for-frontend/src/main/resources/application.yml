spring:
  application:
    name: backend-for-frontend

  output:
    ansi:
      enabled: ALWAYS

  client-endpoints:
    catalog: ${CATALOG_SERVICE_URL:http://localhost:8081}
    media: ${MEDIA_SERVICE_URL:http://localhost:8082}
    wallet: ${WALLET_SERVICE_URL:http://localhost:8084}
    swap: ${SWAP_SERVICE_URL:http://localhost:8085}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FIREBASE_ISSUER_URI:https://securetoken.google.com/bookswap-26231}

http:
  timeoutMs: ${HTTP_TIMEOUT_MS:2000}
  maxInMemoryMb: ${MAX_IN_MEMORY_MB:16}

server:
  port: 8080