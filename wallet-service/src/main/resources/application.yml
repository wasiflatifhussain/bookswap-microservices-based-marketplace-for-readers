spring:
  application:
    name: wallet-service

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bookswap_wallet_db
    username: ${DB_USERNAME:wasiflatifhussain}
    password: ${DB_PASSWORD:password}
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
      services:
        wallet-service:
          topic: wallet.events
    consumer:
      services:
        catalog-service:
          topic: catalog.events
          group-id: wallet-catalog-consumers
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/BookSwap}

server:
  port: 8084

outbox:
  relay:
    fixedDelayMs: 10000