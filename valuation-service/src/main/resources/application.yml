spring:
  application:
    name: valuation-service

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bookswap_valuation_db
    username: ${DB_USERNAME:wasiflatifhussain}
    password: ${DB_PASSWORD:password}
    hikari:
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
      services:
        valuation-service:
          topic: valuation.events
    consumer:
      services:
        catalog-service:
          topic: catalog.events
          group-id: valuation-catalog-consumers
      auto-offset-reset: earliest

keycloak:
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/BookSwap/protocol/openid-connect/token}
  service-service-comms-client:
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:service-service-comms}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}

server:
  port: 8083