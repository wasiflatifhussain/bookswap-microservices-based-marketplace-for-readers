services:
  catalog-service:
    build:
      context: ./catalog-service
    container_name: bookswap-catalog-service
    environment:
      # database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      # firebase auth
      FIREBASE_ISSUER_URI: ${FIREBASE_ISSUER_URI}
    ports:
      - "8081:8081"
    networks:
      - bookswap-net

networks:
  bookswap-net:
    external: true
