services:
  catalog-service:
    build: ./catalog-service
    image: catalog-service:latest
    container_name: catalog-service
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - bookswap-net

  media-service:
    build: ./media-service
    image: media-service:latest
    container_name: media-service
    ports:
      - "8082:8082"
    env_file: .env
    networks:
      - bookswap-net

  valuation-service:
    build: ./valuation-service
    image: valuation-service:latest
    container_name: valuation-service
    ports:
      - "8083:8083"
    env_file: .env
    networks:
      - bookswap-net

networks:
  bookswap-net:
    external: true
